<script src="../src/render/scene.js"></script><script src="../src/ui/audio.js"></script><script>const s=Eco.makeWorld(0,1,42);s.w=16;s.h=16;s.cells=Array.from({length:256},()=>Eco.soil());const spots={};Object.keys(EcoData.VISITORS).forEach((type,n)=>{const i=(2+Math.floor(n/4)*4)*16+2+n%4*4;spots[type]=i;s.cells[i].animal=Eco.animal(type);s.cells[i].animal.age=100;document.querySelector("select").add(new Option(Eco.ANIMAL_NAMES[type],type));});const v=new GardenView(document.querySelector("canvas"),()=>{},()=>{},()=>false,()=>{});v.setWorld(s);document.querySelector("select").onchange=e=>e.target.value?v.focusCell(spots[e.target.value]):v.overview();document.querySelector("#pet").onclick=()=>GardenAudio.pet(document.querySelector("select").value||"ragdoll",{sound:true,music:false});function frame(t){v.render(t);requestAnimationFrame(frame);}requestAnimationFrame(frame);</script></html>
